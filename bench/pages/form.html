<!doctype html>
<!-- 门槛实验用的本地页面：带自动聚焦输入框（光标闪烁）和一段长文，无网络、无动画。 -->
<html><head><meta charset="utf-8"><title>Heddle form</title>
<style>body{font:16px sans-serif;margin:40px;max-width:900px}input,textarea{font:inherit;width:100%;margin:6px 0 18px}</style>
</head><body>
<h1>Expense report</h1>
<label>Title<input id="t" autofocus></label>
<label>Notes<textarea rows="6"></textarea></label>
<script>
const p = [];
for (let i = 0; i < 200; i++) p.push(`<p>Paragraph ${i}: ` + "Lorem ipsum dolor sit amet, consectetur adipiscing elit. ".repeat(6) + "</p>");
document.body.insertAdjacentHTML("beforeend", p.join(""));
</script>
</body></html>
